spring.application.name=carbontrack-backend

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/carbontrack
spring.datasource.username=${DB_USERNAME:carbontrack}
spring.datasource.password=${DB_PASSWORD:carbontrack_dev}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis

# Server
server.port=8080

# JWT configuration - development only
carbontrack.jwt.secret=${JWT_SECRET:carbontrack-dev-secret-key-32-bytes-minimum}

# Password reset and SMTP
carbontrack.password-reset.token-ttl=${PASSWORD_RESET_TOKEN_TTL:PT30M}
carbontrack.password-reset.frontend-url=${CARBONTRACK_FRONTEND_URL:http://localhost:5173}
carbontrack.mail.from=${SMTP_FROM:}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
